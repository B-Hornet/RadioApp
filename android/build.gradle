// File: android/build.gradle
// React Native 0.76+ uses the @react-native/gradle-plugin via plugins DSL.
// AGP and Kotlin versions are explicitly pinned for predictability across CI.
buildscript {
    ext {
        buildToolsVersion = "35.0.0"        // Required for compileSdk 35
        minSdkVersion = 24                  // RN 0.76 floor (hermes-android requires 24)
        compileSdkVersion = 35              // Play requires API 35 (Aug 31 2025)
        targetSdkVersion = 35               // Play requires API 35 (Aug 31 2025)
        ndkVersion = "28.2.13676358"        // r28 required for 16KB pages (Nov 1 2025)
        kotlinVersion = "1.9.24"            // Compatible with AGP 8.5.x + RN 0.76
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.5.1 is the minimum for 16KB page size compliance.
        // RN 0.76 supports AGP 8.x; bumping further (8.7+) is untested here.
        classpath("com.android.tools.build:gradle:8.5.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
