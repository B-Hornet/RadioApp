// File: android/build.gradle
buildscript {
    ext {
        buildToolsVersion = "34.0.0"        // Latest build tools
        minSdkVersion = 23                  // Minimum SDK version supported
        compileSdkVersion = 34              // Compile SDK version
        targetSdkVersion = 34               // Target SDK version
        kotlinVersion = "1.9.24"            // Kotlin version for compatibility
    }

    repositories {
        google()                            // Google's Maven repository for Android
        mavenCentral()                      // Central Maven repository for dependencies
        maven { url "$rootDir/../node_modules/react-native/android" }
    }

    dependencies {
        // Gradle build tools and Kotlin
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // React Native Gradle plugin
        classpath(files("$rootDir/../node_modules/react-native/android/react-native-gradle-plugin"))
    }
}

allprojects {
    repositories {
        // Local React Native module repository (resolve first)
        maven { url "$rootDir/../node_modules/react-native/android" }
        google()
        mavenCentral()
        // Include JitPack for certain dependencies
        maven { url 'https://jitpack.io' }
    }

    // Align Kotlin JVM target across all modules
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

    // RN 0.71+ renamed artifact from react-native to react-android.
    // Map old name so third-party libraries (e.g. react-native-track-player) resolve.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.facebook.react' && details.requested.name == 'react-native') {
                details.useTarget group: 'com.facebook.react', name: 'react-android', version: '0.75.3'
            }
        }
    }
}

