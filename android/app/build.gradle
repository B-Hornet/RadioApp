// File: android/app/build.gradle
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

// Load release signing config from gitignored android/keystore.properties.
// Falls back to debug-signed builds when the file is absent (CI, fresh clones).
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseSigning) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.reebootradioapp'
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.reebootradioapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⚠ versionCode MUST be bumped above the last value uploaded
        //   to Google Play Console before this build ships. Verify
        //   in Play Console → Reeboot Radio → Production → Release
        //   history, then increment the integer below.
        versionCode 2
        versionName "2.2.0"
        multiDexEnabled true
    }

    // 16KB page size compliance (Play requirement, Nov 1 2025).
    // useLegacyPackaging = false uses page-aligned uncompressed .so layout
    // that is 16KB-compatible. Combined with NDK r28+ and AGP 8.5.1+, this
    // is the minimum config Play accepts.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps['REEBOOT_RELEASE_STORE_FILE'])
                storePassword keystoreProps['REEBOOT_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProps['REEBOOT_RELEASE_KEY_ALIAS']
                keyPassword keystoreProps['REEBOOT_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-android"
    implementation "androidx.multidex:multidex:2.0.1"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

def jscFlavor = 'org.webkit:android-jsc:+'
