# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:de$

android.useAndroidX=true

# Architectures to build for. armeabi-v7a + arm64-v8a cover real devices;
# x86/x86_64 are only needed for emulator builds.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Keep the old bridge architecture for now. v2.2.0 is a compliance bump
# (target SDK 35 + 16KB pages); New Architecture migration is a separate
# initiative once track-player + screens have validated Fabric support.
newArchEnabled=false

# Hermes JS engine is required by RN 0.76+ (JSC is opt-in only).
hermesEnabled=true

# Silences the "newer AGP recommended for compileSdk 35" warning.
# AGP 8.5.1 was chosen to match RN 0.76's bundled compatibility window.
android.suppressUnsupportedCompileSdk=35

# Release signing config is loaded from android/keystore.properties (gitignored).
# See android/app/build.gradle for the loader. Builds without that file produce
# debug-signed APKs.

